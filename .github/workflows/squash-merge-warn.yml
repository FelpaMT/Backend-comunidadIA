name: Squash Merge Reminder

on:
  pull_request:
    types:
      - opened
      - reopened

jobs:
  remind_squash_merge:
    name: Squash merge reminder
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Post merge reminder comment
        uses: actions/github-script@v6
        with:
          result-encoding: string
          retries: 3
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const defaultContent = {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ""
            }

            const isFeature  = branchName.startsWith('feature/');
            const isFix      = branchName.startsWith('fix/');
            const isHotfix   = branchName.startsWith('hotfix/');
            const isRelease  = branchName.startsWith('release/');
            const isBackport = branchName.startsWith('backport/');

            if (isFeature || isFix) {
              defaultContent.body = "🔀 **Merge reminder**\n\nThis PR is from a `feature/*` or `fix/*` branch.\nMerge using **Squash & merge** to keep a clean history in `develop`.";
              await github.rest.issues.createComment(defaultContent);
            }
            if (isHotfix) {
              defaultContent.body = "🚨 **Merge reminder**\n\nThis PR is from a `hotfix/*` branch.\nMerge using **Squash & merge** into `develop` (and into `master` if applicable).";
              await github.rest.issues.createComment(defaultContent);
            }
            if (isRelease) {
              defaultContent.body = "🚀 **Merge reminder**\n\nThis PR is from a `release/*` branch.\nMerge using **Merge commit** (not squash) to preserve the full release history in `master`.";
              await github.rest.issues.createComment(defaultContent);
            }
            if (isBackport) {
              defaultContent.body = "🔙 **Merge reminder**\n\nThis PR is from a `backport/*` branch.\nMerge using **Merge commit** to preserve the original commits being backported.";
              await github.rest.issues.createComment(defaultContent);
            }

            console.log("✅ Reminder check complete.");

      - name: Done
        run: echo "✅ Squash merge reminder complete."
